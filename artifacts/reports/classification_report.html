
            <!DOCTYPE html>
            <html>
            <head>
                <title>Model Performance Dashboard</title>

                <style>

                    body {
                        font-family: Arial, sans-serif;
                        background: #f4f6f9;
                        padding: 30px;
                    }

                    h1 {
                        text-align: center;
                        color: #2563eb;
                    }

                    .cards {
                        display: grid;
                        grid-template-columns:
                        repeat(auto-fit, minmax(220px, 1fr));
                        gap: 20px;
                        margin-top: 40px;
                    }

                    .card {
                        background: white;
                        padding: 25px;
                        border-radius: 15px;
                        box-shadow:
                        0px 4px 12px rgba(0,0,0,0.1);
                        text-align: center;
                    }

                    .value {
                        font-size: 32px;
                        font-weight: bold;
                        color: #2563eb;
                    }

                    .label {
                        color: #666;
                        margin-top: 8px;
                    }

                </style>

            </head>

            <body>

                <h1>📊 Titanic Model Performance</h1>

                <div class="cards">

                    <div class="card">
                        <div class="value">
                            81.82%
                        </div>
                        <div class="label">
                            Accuracy
                        </div>
                    </div>

                    <div class="card">
                        <div class="value">
                            81.25%
                        </div>
                        <div class="label">
                            Precision
                        </div>
                    </div>

                    <div class="card">
                        <div class="value">
                            69.64%
                        </div>
                        <div class="label">
                            Recall
                        </div>
                    </div>

                    <div class="card">
                        <div class="value">
                            75.00%
                        </div>
                        <div class="label">
                            F1 Score
                        </div>
                    </div>

                </div>

            </body>
            </html>
